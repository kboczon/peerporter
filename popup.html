<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>PeerTube Tube Import</title>
<style>
  /* No inline scripts: extension pages forbid them, and it keeps the add-on free of
     anything that looks like remote code. */
  body { width: 264px; margin: 0; padding: 10px 12px; background: #1f1f1f; color: #fff;
         font: 400 12px/1.45 "Segoe UI", "Roboto", "Ubuntu", sans-serif; }
  h1 { margin: 0 0 6px; font-size: 13px; }
  #state { margin: 0 0 8px; color: #bdbdbd; }
  #state.bad { color: #ffb28c; }
  button { display: block; width: 100%; margin: 6px 0 0; padding: 7px 8px; border: 0;
           border-radius: 5px; background: #f1683d; color: #fff; font: 700 12px/1.2 inherit;
           cursor: pointer; }
  button.secondary { background: #333333; font-weight: 400; }
  button:disabled { opacity: .55; cursor: default; }
  #hint { margin: 8px 0 0; color: #9e9e9e; }
  #hint.err { color: #ff8a80; }
</style>
</head>
<body>
  <h1>PeerTube Tube Import</h1>
  <p id="state">Checking...</p>
  <button id="import">Import this video</button>
  <button id="settings" class="secondary">Settings and Connect</button>
  <p id="hint"></p>
  <script src="popup.js"></script>
</body>
</html>
